<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%275%27 fill=%27%232b2f33%27/%3E%3Crect x=%274%27 y=%277%27 width=%2711%27 height=%276%27 fill=%27%23b6b0a0%27/%3E%3Crect x=%2717%27 y=%277%27 width=%2711%27 height=%276%27 fill=%27%238c5340%27/%3E%3Crect x=%274%27 y=%2715%27 width=%278%27 height=%276%27 fill=%27%238b8d84%27/%3E%3Crect x=%2714%27 y=%2715%27 width=%2714%27 height=%276%27 fill=%27%23b0ab9f%27/%3E%3Crect x=%274%27 y=%2723%27 width=%2714%27 height=%275%27 fill=%27%239c6b4d%27/%3E%3Crect x=%2720%27 y=%2723%27 width=%278%27 height=%275%27 fill=%27%237a8482%27/%3E%3C/svg%3E">
  <title>宁波博物馆 · 王澍 / 业余建筑工作室 — 卡通三维场景</title>
<style>
  :root{
    --ink:#f4efe3; --ink2:rgba(244,239,227,.80); --ink3:rgba(244,239,227,.60); --ink4:rgba(244,239,227,.40);
    --glass:rgba(18,20,22,.56); --glass2:rgba(18,20,22,.32); --line:rgba(238,232,216,.14);
    --acc:#cfa86a; --acc-soft:rgba(207,168,106,.16); --acc-line:rgba(207,168,106,.55);
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,10,12,.48) 0,rgba(8,10,12,.14) 18%,rgba(8,10,12,0) 34%),
               linear-gradient(0deg,rgba(8,10,12,.56) 0,rgba(8,10,12,.18) 20%,rgba(8,10,12,0) 38%)}

  #brand{position:fixed;top:26px;left:32px;z-index:6;pointer-events:none;max-width:min(42vw,470px)}
  #brand::before{content:'';position:absolute;inset:-26px -50px -24px -36px;z-index:-1;border-radius:24px;
    background:radial-gradient(120% 96% at 14% 40%,rgba(6,8,10,.70) 0,rgba(6,8,10,.34) 56%,rgba(6,8,10,0) 82%)}
  #brand h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:.18em;line-height:1.1;text-shadow:0 2px 28px rgba(0,0,0,.66)}
  #brand .sub{margin-top:9px;font-size:10px;letter-spacing:.30em;color:var(--ink2);text-transform:uppercase}
  #brand .rule{width:32px;height:1px;background:var(--acc);margin:12px 0 10px;opacity:.85}
  #brand .meta{margin-top:10px;font-size:11px;line-height:1.95;letter-spacing:.03em;color:var(--ink3)}
  #brand .meta b{color:var(--ink2);font-weight:400}
  #brand .meta .k{color:var(--acc);opacity:.95}

  #hudwrap{position:fixed;top:26px;right:22px;z-index:6;text-align:right;pointer-events:none}
  #hud{font-size:11px;letter-spacing:.16em;color:var(--ink3);font-variant-numeric:tabular-nums}

  #cams{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:4px;align-items:flex-end;padding:12px 6px 12px 20px;border-radius:18px}
  #cams::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:18px;
    background:linear-gradient(90deg,rgba(6,8,10,0) 0,rgba(6,8,10,.34) 48%,rgba(6,8,10,.48) 100%)}
  #cams .cap{font-size:9px;letter-spacing:.34em;color:var(--ink4);text-transform:uppercase;margin:0 4px 6px 0}
  .cam{appearance:none;font-family:inherit;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2);
    padding:6px 12px;border-radius:999px;font-size:12px;letter-spacing:.08em;transition:all .18s}
  .cam:hover{background:var(--glass2);color:var(--ink);transform:translateX(-2px)}
  .cam.on{background:var(--acc-soft);border-color:var(--acc-line);color:#ffeecd}

  #dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;width:min(1220px,calc(100vw - 44px));
    background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 18px 13px;
    backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);
    box-shadow:0 18px 54px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .32s,opacity .32s}
  #dock.hide{transform:translateX(-50%) translateY(140%);opacity:0}
  #dock .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  #dock .row + .row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(238,232,216,.08)}
  .grp{display:flex;align-items:center;gap:8px}
  .lab{font-size:9.5px;letter-spacing:.24em;color:var(--ink4);text-transform:uppercase;white-space:nowrap}
  #hourLabel{font-family:var(--serif);font-size:19px;letter-spacing:.06em;color:#ffeecd;min-width:62px;font-variant-numeric:tabular-nums}
  input[type=range]{appearance:none;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(90deg,#26303f,#4c6480 22%,#ffd08a 52%,#f09a52 66%,#2b3547 80%,#171d29)}
  input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#fff6e2,#cfa86a);border:1px solid rgba(255,255,255,.7);box-shadow:0 0 12px rgba(207,168,106,.55)}
  #hour{width:min(44vw,400px)}
  #exposure{width:120px}
  .btn{appearance:none;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--ink2);padding:5px 11px;border-radius:999px;font-size:11.5px;letter-spacing:.06em;transition:all .16s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.10);color:var(--ink)}
  .btn.on{background:var(--acc-soft);border-color:var(--acc-line);color:#ffeecd}
  .btn.tiny{font-size:11px;padding:5px 9px}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .hint{font-size:10.5px;color:var(--ink4);letter-spacing:.04em;margin-left:auto;text-align:right;line-height:1.6}
  #expLabel{font-size:11px;color:var(--ink2);min-width:30px;font-variant-numeric:tabular-nums}

  #errs{position:fixed;left:32px;bottom:118px;z-index:9;max-width:min(60vw,620px);display:none;
    background:rgba(70,12,14,.86);border:1px solid rgba(255,120,120,.5);border-radius:10px;padding:10px 13px;
    font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#ffd9d9;white-space:pre-wrap}
  @media (max-width:900px){
    #brand{max-width:66vw} #brand h1{font-size:21px}
    #cams{display:none} #hour{width:40vw}
    .hint{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="scrim"></div>

<header id="brand">
  <h1>宁波博物馆</h1>
  <div class="sub">Ningbo History Museum · 2008</div>
  <div class="rule"></div>
  <div class="meta">
    <b>王澍 · 陆文宇</b>／业余建筑工作室　普利兹克奖得主代表作<br>
    主体 <span class="k">144 × 65 × 24 m</span>　三层起裂开成 <span class="k">5</span> 个体量如山体<br>
    直壁 <span class="k">瓦爿墙</span>（百万块回收旧砖瓦 · 1.3 万 m²）　斜壁 <span class="k">竹条模板混凝土</span><br>
    西端面向城市的裂口 · 南面"山谷"大台阶 · 三面环水
  </div>
</header>

<div id="hudwrap"><div id="hud">—</div></div>

<nav id="cams">
  <div class="cap">Cameras</div>
  <button class="cam" data-cam="hero">全景</button>
  <button class="cam" data-cam="portal">裂口</button>
  <button class="cam" data-cam="valley">山谷台阶</button>
  <button class="cam" data-cam="wall">瓦爿墙</button>
  <button class="cam" data-cam="water">水岸</button>
  <button class="cam" data-cam="ridge">屋脊</button>
  <button class="cam" data-cam="aerial">鸟瞰</button>
  <button class="cam" data-cam="night">夜色</button>
  <button class="cam" data-cam="walk">漫步</button>
</nav>

<div id="dock">
  <div class="row">
    <div class="grp">
      <span class="lab">时刻</span>
      <span id="hourLabel">15:24</span>
      <input id="hour" type="range" min="0" max="24" step="0.05" value="15.4">
    </div>
    <div class="grp">
      <button class="btn tiny" data-hour="6.6">清晨</button>
      <button class="btn tiny" data-hour="12.0">正午</button>
      <button class="btn tiny" data-hour="17.7">黄金时刻</button>
      <button class="btn tiny" data-hour="19.6">入夜</button>
      <button class="btn tiny" data-hour="22.4">深夜</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <span class="lab">曝光</span>
      <input id="exposure" type="range" min="0.55" max="1.8" step="0.01" value="1">
      <span id="expLabel">1.00</span>
    </div>
    <div class="hint">拖动画面自由环视 · 滚轮缩放<br>O 键开关自动环绕 · H 键隐藏面板</div>
  </div>
  <div class="row">
    <div class="grp">
      <span class="lab">开关</span>
      <button class="btn" data-toggle="orbit">自动环绕</button>
      <button class="btn" data-toggle="people">游客</button>
      <button class="btn" data-toggle="outline">卡通描边</button>
      <button class="btn" data-toggle="water">水面倒影</button>
      <button class="btn" data-toggle="shadows">阴影</button>
      <button class="btn" data-toggle="bloom">泛光</button>
      <button class="btn" data-toggle="quality">高画质</button>
    </div>
  </div>
</div>

<div id="errs"></div>

<script>
  window.__ERRORS__ = [];
  function __show(v){
    window.__ERRORS__.push(v);
    var e = document.getElementById('errs');
    if (e){ e.style.display='block'; e.textContent = window.__ERRORS__.slice(-4).join('\n'); }
  }
  addEventListener('error', function(ev){ __show('ERR: ' + (ev.message || ev.error)); });
  addEventListener('unhandledrejection', function(ev){ __show('REJECT: ' + ev.reason); });
</script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
